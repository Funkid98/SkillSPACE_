name: recruiter_profile
description: "Recruiter Profile Management for SkillSpace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  fluttertoast: ^8.2.10
  flutter_bloc: ^8.1.3
  shared_preferences: ^2.3.2
  visibility_detector: ^0.4.0+2
  pfe:
    path: ../../login-register
  file_picker: ^8.3.7
  awesome_dialog: ^3.3.0
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.0.0
  country_flags: ^3.2.0
  country_picker: ^2.0.27
  reactive_theme: 2.1.0
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
