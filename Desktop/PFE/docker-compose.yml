services:

  # ───────── API GATEWAY (Express) ─────────
  api-gateway:
    image: funkid99/skillspace-gateway:latest
    build:
      context: ./Backend/api-gateway
    ports:
      - "8088:8080"
    env_file:
      - ./Backend/api-gateway/.env
    environment:
      - AUTH_SERVICE_URL=http://login-register:5001
      - CANDIDAT_SERVICE_URL=http://candidat:5000
      - RECRUITER_SERVICE_URL=http://recruiter:5002
      - OFFER_SERVICE_URL=http://offer:5003
      - TRAINER_SERVICE_URL=http://trainer:5004
      - INTERVIEW_SERVICE_URL=http://interview:5005
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5050,http://127.0.0.1:5050,http://localhost:5500,http://127.0.0.1:5500,http://localhost,http://localhost:80
    depends_on:
      - login-register
      - candidat
      - recruiter
      - offer
      - trainer
      - interview
    restart: always

  # ───────── NGINX GATEWAY (frontend + legacy) ──
  gateway:
    image: nginx:latest
    ports:
      - "3000:80"
      - "5050:80"
      - "5500:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-gateway
      - frontend
    restart: always

  # ───────── LOGIN SERVICE ───────
  login-register:
    image: funkid99/skillspace-login:latest
    build:
      context: ./Backend/login-register-services
    expose:
      - "5001"
    env_file:
      - ./Backend/login-register-services/.env
    environment:
      - INTERNAL_GATEWAY_URL=http://api-gateway:8080
    restart: always

  # ───────── CANDIDAT SERVICE ────
  candidat:
    image: funkid99/skillspace-candidat:latest
    build:
      context: ./Backend/candidat-service
    expose:
      - "5000"
    env_file:
      - ./Backend/candidat-service/.env
    environment:
      - INTERNAL_GATEWAY_URL=http://api-gateway:8080
    restart: always

  # ───────── RECRUITER SERVICE ───
  recruiter:
    image: funkid99/skillspace-recruiter:latest
    build:
      context: ./Backend/recruter-service
    expose:
      - "5002"
    env_file:
      - ./Backend/recruter-service/.env
    environment:
      - INTERNAL_GATEWAY_URL=http://api-gateway:8080
    restart: always

  # ───────── OFFER SERVICE ───────
  offer:
    image: funkid99/skillspace-offer:latest
    build:
      context: ./Backend/offer-service
    expose:
      - "5003"
    env_file:
      - ./Backend/offer-service/.env
    environment:
      - INTERNAL_GATEWAY_URL=http://api-gateway:8080
    restart: always

  # ───────── TRAINER SERVICE ─────
  trainer:
    image: funkid99/skillspace-trainer:latest
    build:
      context: ./TrainerProfile-main/backend
    expose:
      - "5004"
    env_file:
      - ./TrainerProfile-main/backend/.env
    environment:
      - INTERNAL_GATEWAY_URL=http://api-gateway:8080
    restart: always

  # ───────── INTERVIEW SERVICE ───
  interview:
    image: funkid99/skillspace-interview:latest
    build:
      context: ./Backend/interview-service
    expose:
      - "5005"
    env_file:
      - ./Backend/interview-service/.env
    environment:
      - INTERNAL_GATEWAY_URL=http://api-gateway:8080
    restart: always

  # ───────── FRONTEND ────────────
  frontend:
    image: funkid99/skillspace-frontend:latest
    build:
      context: .
      dockerfile: skillspace_front/Dockerfile
    restart: always

networks:
  default:
    name: skillspace-network
