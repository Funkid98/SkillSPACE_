server {

    listen 80;

    # ───────── FRONTEND ─────────
    location / {
        proxy_pass http://frontend:80;
    }

    # ───────── ALL API ──────────
    # Route everything through the Express API Gateway,
    # which handles path rewriting and service routing.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # ───── Legacy direct-service paths ─────
    # These are called by the Flutter frontend without /api/ prefix.
    location ~ ^/(candidat|cv|quiz|recommend|recruiter|uploads|offers|job|formateur|api/interview)/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }
}
