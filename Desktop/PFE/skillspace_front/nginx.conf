server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Auth Application
    location /auth/ {
        alias /usr/share/nginx/html/auth/;
        try_files $uri $uri/ /auth/index.html;
    }

    # Trainer Application
    location /trainer/ {
        alias /usr/share/nginx/html/trainer/;
        try_files $uri $uri/ /trainer/index.html;
    }

    # Recruiter Dashboard
    location /recruiter/ {
        alias /usr/share/nginx/html/recruiter/;
        try_files $uri $uri/ /recruiter/index.html;
    }

    # Candidat Dashboard
    location /candidat/ {
        alias /usr/share/nginx/html/candidat/;
        try_files $uri $uri/ /candidat/index.html;
    }

    # Main Landing / Root Application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
