name: skillspace
description: SkillSpace - Plateforme de recrutement intelligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  visibility_detector: ^0.4.0+2
  http: ^1.6.0
  fl_chart: ^0.69.0
  file_picker: ^8.1.7
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  pfe:
    path: ../login-register
  trainer_profile:
    path: ../TrainerProfile-main/frontend
  recruiter_profile:
    path: ../RecruiterProfile/frontend
  reactive_theme: 2.1.0
  form_validator: ^2.1.1
  flutter_localizations:
    sdk: flutter
  intl: any
  csc_picker: ^0.2.7
  country_state_city_pro: ^0.0.6
  country_state_city_picker: ^1.2.8
  csc_picker_plus: ^0.0.3
  country_picker: ^2.0.27
  awesome_dialog: ^3.3.0
  image_picker: any
  intl_phone_number_input: 0.7.5
  google_fonts: ^6.2.1 
  country_flags: ^3.0.0
  speech_to_text: ^7.3.0
  camera: ^0.11.2
  record: ^6.2.0
  path_provider: ^2.1.2
  audioplayers: ^6.6.0
  rive: ^0.14.1
  lottie: ^3.1.2
  video_player: ^2.10.0
  timeago: ^3.7.1
  glassmorphism: ^3.0.0
  calendar_date_picker2: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/