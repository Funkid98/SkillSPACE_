name: skillspace
description: SkillSpace - Plateforme de recrutement intelligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  visibility_detector: ^0.4.0+2
  http: ^1.1.0
  file_picker: ^8.1.7
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  pfe:
    path: ../login-register
  flutter_localizations:
    sdk: flutter
  intl: any
  csc_picker: ^0.2.7
  country_state_city_pro: ^0.0.6
  country_state_city_picker: ^1.2.8
  csc_picker_plus: ^0.0.3
  country_picker: ^2.0.27

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/